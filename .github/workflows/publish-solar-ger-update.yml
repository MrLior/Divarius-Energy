name: Publish Solar Ger update

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: solar-ger-manifest
  cancel-in-progress: false

jobs:
  publish-manifest:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and validate the release archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ "$VERSION" == "$TAG" ]] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release tag must be in the form vX.Y.Z, for example v0.7.2."
            exit 1
          fi

          ASSET="Solar_Ger_v${VERSION}.rbz"
          mkdir -p dist releases
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "$ASSET" --dir dist
          test -s "dist/$ASSET"
          cp "dist/$ASSET" "releases/$ASSET"

          SHA256="$(sha256sum "dist/$ASSET" | awk '{print $1}')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Generate the update manifest
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ env.VERSION }}
          ASSET: ${{ env.ASSET }}
          SHA256: ${{ env.SHA256 }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const asset = process.env.ASSET;
          const notes = (process.env.RELEASE_NOTES || '').trim();
          const date = (process.env.PUBLISHED_AT || new Date().toISOString()).slice(0, 10);
          const manifest = {
            schema_version: 1,
            plugin: 'Solar Ger',
            version,
            published_at: date,
            file_name: asset,
            rbz_url: `https://raw.githubusercontent.com/${process.env.REPOSITORY}/main/releases/${asset}`,
            sha256: process.env.SHA256,
            release_notes: notes || `Solar Ger v${version}`
          };
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Publish the archive and manifest to main
        env:
          VERSION: ${{ env.VERSION }}
          ASSET: ${{ env.ASSET }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json "releases/$ASSET"
          if git diff --cached --quiet; then
            echo "Manifest already matches this release."
            exit 0
          fi
          git commit -m "Publish Solar Ger v${VERSION}"
          git push origin HEAD:main
